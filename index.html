<style>
  :root{
    --bg:#f3f5f8; --card:#fff; --text:#1b2430; --muted:#6b7684; --line:#e1e6ec;
    --primary:#1f4e78; --einlass:#2f6db5; --verzehr:#2f8a55;
    --ok:#1f8a4c; --bad:#c62f2f; --warn:#c77a12; --input:#fffbea;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#11161d; --card:#1a212b; --text:#e8edf3; --muted:#9aa6b4; --line:#2a3441;
      --primary:#5b9be0; --einlass:#5b9be0; --verzehr:#4fbf80; --input:#232b36; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
  header{position:sticky;top:0;z-index:10;background:var(--primary);color:#fff;
    padding:12px 16px 0;padding-top:max(12px,env(safe-area-inset-top))}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .brand img{width:46px;height:46px;flex:none}
  header h1{margin:0;font-size:18px;line-height:1.2}
  nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
  nav button{flex:1 0 auto;border:0;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;
    background:rgba(255,255,255,.15);color:#fff;cursor:pointer}
  nav button.active{background:#fff;color:var(--primary)}
  main{max-width:760px;margin:0 auto;padding:16px;padding-bottom:80px}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .card h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  input[type=number],input[type=text],input[type=date],textarea{width:100%;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;font-size:17px;background:var(--input);color:var(--text);font-family:inherit}
  textarea{min-height:90px;resize:vertical;line-height:1.4}
  input:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:0}
  details{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
  summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;
    align-items:center;font-weight:600}
  summary::-webkit-details-marker{display:none}
  summary .sum{font-variant-numeric:tabular-nums;margin-left:auto}
  summary::after{content:"▾";margin-left:8px;color:var(--muted)}
  details[open] summary::after{content:"▴"}
  .notes{padding:4px 12px 12px}
  .group-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.05em;margin:12px 0 2px}
  .note-row{display:grid;grid-template-columns:96px 40px 1fr 40px;gap:8px;align-items:center;
    padding:6px 0;border-bottom:1px dashed var(--line)}
  .note-row:last-child{border-bottom:0}
  .note-row .sub{grid-column:1/-1;text-align:right;font-size:12px;color:var(--muted);margin-top:-4px}
  .note-row .sub:empty{display:none}
  .note{width:96px;height:52px;display:block;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .coinimg{width:96px;height:52px;display:block}
  .step{height:40px;border:0;border-radius:10px;background:var(--line);color:var(--text);
    font-size:22px;font-weight:700;cursor:pointer;touch-action:manipulation}
  .step:active{transform:scale(.95)}
  .note-row input{text-align:center;padding:9px 6px}
  .other{display:grid;grid-template-columns:1fr 140px;gap:8px;align-items:center;padding-top:8px}
  .other label{margin:0}
  .results{margin-top:14px;border-radius:12px;background:var(--bg);padding:10px 14px}
  .r{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-variant-numeric:tabular-nums}
  .r+.r{border-top:1px solid var(--line)}
  .r b{font-weight:700}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
  .btns{display:flex;flex-wrap:wrap;gap:8px}
  .btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;font-size:15px;cursor:pointer;
    background:var(--primary);color:#fff;flex:1 1 auto}
  .btn.excel{background:#1f7a45}
  .btn.danger{background:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;white-space:normal}
  thead th{font-size:12px;color:var(--muted)}
  tr.sec td{background:var(--bg);font-weight:700;text-align:left}
  tr.total td{font-weight:800;font-size:15px}
  .scroll{overflow-x:auto}
  .hint{font-size:13px;color:var(--muted);margin:6px 0 0}
  .big{font-size:28px;font-weight:800;text-align:center;margin:4px 0 0}
  .notelist p{margin:0 0 10px;white-space:pre-wrap} .notelist b{display:block;font-size:13px;color:var(--muted)}
</style>
</head>

/* ================= Zustand ================= */
const emptyMoney = () => Object.assign(Object.fromEntries(NOTES.map(n=>[n,0])), {c2:0,c1:0,c05:0,m:0});
const emptyShift = () => ({
  name:"", notiz:"",
  einlass:{helfer:"", bandStart:"", bandEnde:"", geldStart:emptyMoney(), geldEnde:emptyMoney()},
  verzehr:{helfer:"", karteStart:"", karteEnde:"", zurueck:"", geldStart:emptyMoney(), geldEnde:emptyMoney()},
});
const emptyState = () => ({datum:new Date().toISOString().slice(0,10), titel:"", preisBand:"", preisKarte:"",
  schichten:SCHICHTEN.map(emptyShift), tab:"setup"});

let state;
try { state = JSON.parse(localStorage.getItem(STORE_KEY)) || emptyState(); } catch(e){ state = emptyState(); }
// ältere Speicherstände ergänzen
state.schichten.forEach(s=>{
  s.notiz ??= ""; s.einlass.helfer ??= ""; s.verzehr.helfer ??= "";
  [s.einlass.geldStart,s.einlass.geldEnde,s.verzehr.geldStart,s.verzehr.geldEnde]
    .forEach(m=>{ for(const c of COINS) m[c.k] ??= 0; m.m ??= 0; });
});
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){} };

/* ================= Helfer ================= */
const eur = v => v==null || isNaN(v) ? "–" : v.toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const cnt = v => v==null || isNaN(v) ? "–" : v.toLocaleString("de-DE");
const num = v => (v===""||v==null) ? null : Number(v);
const moneyTotal = m => NOTES.reduce((s,n)=>s+n*(Number(m[n])||0),0)
  + COINS.reduce((s,c)=>s+c.v*(Number(m[c.k])||0),0) + (Number(m.m)||0);
const get = path => path.split(".").reduce((o,k)=>o?.[k], state);
const set = (path, val) => { const k=path.split("."), last=k.pop(); k.reduce((o,x)=>o[x], state)[last]=val; };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const datumDE = () => state.datum ? new Date(state.datum+"T12:00").toLocaleDateString("de-DE") : "";

function noteSvg(v){
  const c = NOTE_COLORS[v];
  return `<svg class="note" viewBox="0 0 120 64" role="img" aria-label="${v} Euro Schein">
    <rect width="120" height="64" rx="6" fill="${c}"/>
    <rect y="40" width="120" height="24" fill="rgba(0,0,0,.12)"/>
    <circle cx="90" cy="30" r="22" fill="rgba(255,255,255,.18)"/>
    <circle cx="90" cy="30" r="14" fill="rgba(255,255,255,.12)"/>

function coinSvg(c){
  const gold="#d4a838", silver="#c3c7cc";

/* ================= Berechnung ================= */
function calc(s){
  const p = num(state.preisBand), q = num(state.preisKarte);
  const e = s.einlass, v = s.verzehr;
  const bs=num(e.bandStart), be=num(e.bandEnde);
  const eVerk = bs!=null && be!=null ? bs-be : null;
  const eStart = moneyTotal(e.geldStart), eEnde = moneyTotal(e.geldEnde);
  const eGewinn = eEnde - eStart;
  const eSoll = eVerk!=null && p!=null ? eVerk*p : null;
  const eDiff = eSoll!=null ? eGewinn - eSoll : null;

  const ks=num(v.karteStart), ke=num(v.karteEnde), z=num(v.zurueck);
  const vVerk = ks!=null && ke!=null ? ks-ke : null;
  const vStart = moneyTotal(v.geldStart), vEnde = moneyTotal(v.geldEnde);
  const vGewinn = vEnde - vStart;
  const vVerlust = z!=null && q!=null ? z*q : null;
  const vSoll = vVerk!=null && q!=null ? (vVerk-(z||0))*q : null;
  const vDiff = vSoll!=null ? vGewinn - vSoll : null;
  return {bs,be,eVerk,eStart,eEnde,eGewinn,eSoll,eDiff,ks,ke,vVerk,z,vStart,vEnde,vGewinn,vVerlust,vSoll,vDiff,
          gesamt:eGewinn+vGewinn};
}
const sumOf = (rs,k) => rs.some(r=>r[k]!=null) ? rs.reduce((a,r)=>a+(r[k]||0),0) : null;
const diffClass = d => d==null ? "" : Math.abs(d)<0.005 ? "ok" : d<0 ? "bad" : "warn";
function diffHtml(d){
  if(d==null) return `<span>–</span>`;
  if(Math.abs(d)<0.005) return `<b class="ok">${eur(0)} ✓ stimmt</b>`;
  return d<0 ? `<b class="bad">${eur(d)} Fehlbetrag</b>` : `<b class="warn">+${eur(d)} Überschuss</b>`;
}

/* Gemeinsame Berichtsstruktur für Übersicht, PDF und Excel */
function buildReport(){
  const rs = state.schichten.map(calc);
  const R = [];
  const row = (label,k,fmt,total=true) => R.push({type:"row",label,fmt,vals:[...rs.map(r=>r[k]), total?sumOf(rs,k):null],noTotal:!total});
  const diff = (label,k) => R.push({type:"diff",label,fmt:"eur",vals:[...rs.map(r=>r[k]), sumOf(rs,k)]});
  const helfer = k => R.push({type:"text",label:"Helfer",vals:[...state.schichten.map(s=>s[k].helfer||"–"), ""]});
  R.push({type:"sec",label:"Einlasskasse",kasse:"einlass"}); helfer("einlass");
  row("Einlassbänder Start","bs","cnt",false); row("Einlassbänder Ende","be","cnt",false);
  row("Verkaufte Einlassbänder","eVerk","cnt"); row("Geld Start","eStart","eur"); row("Geld Ende","eEnde","eur");
  row("Gewinn","eGewinn","eur"); row("Soll laut Bändern","eSoll","eur"); diff("Kassendifferenz","eDiff");
  R.push({type:"sec",label:"Verzehrkasse",kasse:"verzehr"}); helfer("verzehr");
  row("Verzehrkarten Start","ks","cnt",false); row("Verzehrkarten Ende","ke","cnt",false);
  row("Verkaufte Verzehrkarten","vVerk","cnt"); row("Zurückgegebene Karten","z","cnt");
  row("Geld Start","vStart","eur"); row("Geld Ende","vEnde","eur"); row("Verlust (Rückgaben)","vVerlust","eur");
  row("Gewinn","vGewinn","eur"); row("Soll","vSoll","eur"); diff("Kassendifferenz","vDiff");
  R.push({type:"total",label:"Gesamtgewinn",fmt:"eur",vals:[...rs.map(r=>r.gesamt), sumOf(rs,"gesamt")]});
  R.push({type:"text",label:"Gezählt von",vals:[...state.schichten.map(s=>s.name||"–"), ""]});
  return {rows:R, total:sumOf(rs,"gesamt"),
    notes: state.schichten.map((s,i)=>({schicht:`${SCHICHTEN[i].name} (${SCHICHTEN[i].zeit})`, text:(s.notiz||"").trim()})).filter(n=>n.text)};
}

function pdfEnc(s){
  let o=""; for(const ch of String(s)){
    const c = ch.codePointAt(0);
    if(WINANSI[ch]!=null) o+=String.fromCharCode(WINANSI[ch]);
    else if(c===10||c===13) o+=" ";
    else if(c<256 && c>=32) o+=ch; else o+="?";

const pdfW = (s,bold,size) => { const t=pdfEnc(s), W=bold?HELVB:HELV; let w=0;
  for(let i=0;i<t.length;i++){ const c=t.charCodeAt(i); w+=W[c-32]||556; } return w*size/1000; };
const pdfStr = t => "(" + t.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)") + ")";
const rgb = hex => [1,3,5].map(i=>(parseInt(hex.slice(i,i+2),16)/255).toFixed(3)).join(" ");

function makePdf(){
  const PW=595.28, PH=841.89, M=40;
  const pages=[]; let ops=[], y=M;
  const newPage=()=>{ if(ops.length) pages.push(ops.join("\n")); ops=[]; y=M; };

  const rect=(x,top,w,h,fill)=>ops.push(`${rgb(fill)} rg ${x.toFixed(2)} ${(PH-top-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
  const line=(x1,top,x2,col="#d0d5db",lw=.5)=>ops.push(`${rgb(col)} RG ${lw} w ${x1.toFixed(2)} ${Y(top)} m ${x2.toFixed(2)} ${Y(top)} l S`);
  const text=(s,x,top,{size=9.5,bold=false,color="#1b2430",align="left"}={})=>{
    const w=pdfW(s,bold,size); const xx = align==="right"? x-w : align==="center"? x-w/2 : x;
    ops.push(`BT /${bold?"F2":"F1"} ${size} Tf ${rgb(color)} rg ${xx.toFixed(2)} ${Y(top)} Td ${pdfStr(pdfEnc(s))} Tj ET`);
  };
  const wrap=(s,maxW,size)=>{ const out=[]; for(const para of String(s).split(/\r?\n/)){
      let cur=""; for(const word of para.split(/\s+/)){ const t=cur?cur+" "+word:word;
        if(pdfW(t,false,size)>maxW && cur){ out.push(cur); cur=word; } else cur=t; }
      out.push(cur); } return out; };
  const ensure=h=>{ if(y+h>PH-M-20) newPage(); };

  const rep = buildReport();
  // Kopf mit Logo rechts oben
  { const lh=66, lw=lh*LOGO_PDF.w/LOGO_PDF.h; ops.push(`q ${lw.toFixed(2)} 0 0 ${lh} ${(PW-M-lw).toFixed(2)} ${(PH-M-lh+4).toFixed(2)} cm /Im1 Do Q`); }
  text("Kassenabrechnung – Einlass & Verzehr", M, y+16, {size:18,bold:true,color:"#1f4e78"}); y+=28;
  const meta=[state.titel, datumDE()].filter(Boolean).join("  ·  ");
  if(meta){ text(meta, M, y+10, {size:11}); y+=18; }
  const preise=[state.preisBand!==""?`Einlassband: ${eur(num(state.preisBand))}`:"", state.preisKarte!==""?`Verzehrkarte: ${eur(num(state.preisKarte))}`:""].filter(Boolean).join("     ");
  if(preise){ text("Preise  "+preise, M, y+10, {size:9.5,color:"#6b7684"}); y+=16; }
  y+=6;
  // Gesamtbox
  rect(M,y,PW-2*M,38,"#fce4d6");
  text("Gesamtgewinn des Abends", M+12, y+24, {size:12,bold:true});
  text(eur(rep.total), PW-M-12, y+25, {size:16,bold:true,color:"#1f4e78",align:"right"});
  y+=52;

  // Tabelle
  const colL=175, colW=(PW-2*M-colL)/4, rowH=17;
  const colX = i => M+colL+colW*(i+1)-6;
  rect(M,y,PW-2*M,30,"#1f4e78");
  [...SCHICHTEN.map(s=>[s.name,s.zeit]),["Gesamt",""]].forEach((h,i)=>{
    text(h[0], colX(i), y+13, {size:9.5,bold:true,color:"#ffffff",align:"right"});
    if(h[1]) text(h[1], colX(i), y+24, {size:8,color:"#dbe6f2",align:"right"});
  });
  y+=30;
  const fmt=(v,f)=>f==="cnt"?cnt(v):eur(v);
  const pdfCol={ok:"#1f8a4c",bad:"#c62f2f",warn:"#c77a12"};
  rep.rows.forEach(r=>{
    ensure(rowH);
    if(r.type==="sec"){
      rect(M,y,PW-2*M,rowH+2,r.kasse==="einlass"?"#ddebf7":"#e2efda");
      text(r.label.toUpperCase(), M+6, y+12.5, {size:9.5,bold:true,color:r.kasse==="einlass"?"#1f4e78":"#2f6b3f"});
      y+=rowH+2; return;
    }
    if(r.type==="text"){
      const cells=r.vals.map(v=>wrap(v||"",colW-10,8.5));
      const h=Math.max(1,...cells.map(c=>c.length))*11+6;
      ensure(h);
      text(r.label, M+6, y+12);
      cells.forEach((ls,i)=>ls.forEach((l,k)=>text(l, colX(i), y+12+k*11, {size:8.5,align:"right"})));
      y+=h; line(M,y,PW-M); return;
    }
    const total=r.type==="total";
    if(total){ y+=4; rect(M,y,PW-2*M,rowH+4,"#fce4d6"); }
    const h = total? rowH+4 : rowH, base = y + (total?13.5:12);
    text(r.label, M+6, base, {bold:total||r.type==="diff"});
    r.vals.forEach((v,i)=>{
      let s, color="#1b2430", bold = total || i===3;
      if(r.type==="text") s = v;
      else if(i===3 && r.noTotal) { s="–"; color="#9aa6b4"; }
      else if(r.type==="diff"){ s = v==null?"–":(v>0.005?"+":"")+eur(Math.abs(v)<0.005?0:v); color=pdfCol[diffClass(v)]||color; bold=true; }
      else s = fmt(v,r.fmt);
      text(s, colX(i), base, {bold, color, align:"right", size: r.type==="text"?8.5:9.5});
    });
    y+=h; if(!total) line(M,y,PW-M);
  });
  y+=10;
  text("Kassendifferenz: grün = stimmt, rot = Fehlbetrag, orange = Überschuss", M, y+8, {size:8,color:"#6b7684"}); y+=20;

  // Notizen
  if(rep.notes.length){
    ensure(40); text("Notizen", M, y+12, {size:12,bold:true,color:"#1f4e78"}); y+=22;
    rep.notes.forEach(n=>{
      const lines=wrap(n.text, PW-2*M-12, 9.5);
      ensure(16+lines.length*13);
      text(n.schicht, M, y+10, {size:9.5,bold:true}); y+=15;
      lines.forEach(l=>{ ensure(13); text(l, M+12, y+10, {size:9.5}); y+=13; });
      y+=6;
    });
  }
  newPage();

  // Seiten zusammenbauen, Fußzeile ergänzen
  const stamp = new Date().toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"});
  const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
  const catalog=add(""), pagesId=add("");
  const f1=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  const f2=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  const smask=add(`<< /Type /XObject /Subtype /Image /Width ${LOGO_PDF.w} /Height ${LOGO_PDF.h} /ColorSpace /DeviceGray /BitsPerComponent 8 /Filter /FlateDecode /Length ${atob(LOGO_PDF.alpha).length} >>\nstream\n${atob(LOGO_PDF.alpha)}\nendstream`);
  const im1=add(`<< /Type /XObject /Subtype /Image /Width ${LOGO_PDF.w} /Height ${LOGO_PDF.h} /ColorSpace /DeviceGray /BitsPerComponent 8 /Filter /FlateDecode /SMask ${smask} 0 R /Length ${atob(LOGO_PDF.gray).length} >>\nstream\n${atob(LOGO_PDF.gray)}\nendstream`);
  const kids=[];
  pages.forEach((c,i)=>{
    const foot=`BT /F1 8 Tf ${rgb("#9aa6b4")} rg ${M} 24 Td ${pdfStr(pdfEnc(`Erstellt am ${stamp}`))} Tj ET\n`+
      `BT /F1 8 Tf ${rgb("#9aa6b4")} rg ${(PW-M-pdfW(`Seite ${i+1} von ${pages.length}`,false,8)).toFixed(2)} 24 Td ${pdfStr(`Seite ${i+1} von ${pages.length}`)} Tj ET`;
    const content=c+"\n"+foot;
    const cs=add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    kids.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> /XObject << /Im1 ${im1} 0 R >> >> /Contents ${cs} 0 R >>`));
  });
  objs[catalog-1]=`<< /Type /Catalog /Pages ${pagesId} 0 R >>`;
  objs[pagesId-1]=`<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;
  let pdf="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"; const offs=[];
  objs.forEach((o,i)=>{ offs.push(pdf.length); pdf+=`${i+1} 0 obj\n${o}\nendobj\n`; });
  const xref=pdf.length;
  pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("");
  pdf+=`trailer\n<< /Size ${objs.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes=new Uint8Array(pdf.length); for(let i=0;i<pdf.length;i++) bytes[i]=pdf.charCodeAt(i)&255;
  return bytes;
}

/* ================= Excel-Export (.xlsx, ohne externe Bibliotheken) ================= */
const xmlEsc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");
const colName = i => { let s=""; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26);} return s; };
// Stil-Indizes (siehe styles.xml unten)
const ST={def:0,title:1,head:2,secE:3,secV:4,label:5,cnt:6,eur:7,totEur:8,totLabel:9,red:10,green:11,orange:12,wrap:13,muted:14,center:15,bold:16,dash:17};

function sheetXml(rows, cols, merges=[], extra=""){
  const rx = rows.map((r,ri)=>{
    if(!r) return "";
    const cells = r.cells.map((c,ci)=>{
      if(c==null) return "";
      const ref = colName(ci)+(ri+1), s = c.s??0;
      if(c.v==null||c.v==="") return `<c r="${ref}" s="${s}"/>`;
      if(typeof c.v==="number") return `<c r="${ref}" s="${s}"><v>${Math.round(c.v*100)/100}</v></c>`;
      return `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(c.v)}</t></is></c>`;
    }).join("");
    return `<row r="${ri+1}"${r.h?` ht="${r.h}" customHeight="1"`:""}>${cells}</row>`;
  }).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>
<sheetViews><sheetView workbookViewId="0" showGridLines="0"/></sheetViews>
<cols>${cols.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols>
<sheetData>${rx}</sheetData>
${merges.length?`<mergeCells count="${merges.length}">${merges.map(m=>`<mergeCell ref="${m}"/>`).join("")}</mergeCells>`:""}
<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>
${extra}
</worksheet>`;
}

/* Minimaler ZIP-Packer (unkomprimiert) */
const CRC_T = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
const crc32 = d => { let c=0xFFFFFFFF; for(let i=0;i<d.length;i++) c = CRC_T[(c^d[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
function zip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const d=new Date(), dosT=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),
        dosD=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const [name,content] of Object.entries(files)){
    const nm=enc.encode(name), data=content instanceof Uint8Array ? content : enc.encode(content), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,dosT,true); lh.setUint16(12,dosD,true); lh.setUint32(14,crc,true);
    lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true); ch.setUint16(12,dosT,true); ch.setUint16(14,dosD,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,nm.length,true);
    ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nm);
    off += 30+nm.length+data.length;
  }
  const cdSize=central.reduce((a,p)=>a+p.length,0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,Object.keys(files).length,true); end.setUint16(10,Object.keys(files).length,true);
  end.setUint32(12,cdSize,true); end.setUint32(16,off,true);
  const all=[...parts,...central,new Uint8Array(end.buffer)];
  const out=new Uint8Array(all.reduce((a,p)=>a+p.length,0)); let p=0; for(const a of all){ out.set(a,p); p+=a.length; }
  return out;
}
